<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gohan Waitlist">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gohan — Join the Waitlist</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    background:#ffffff; font-family:Arial,sans-serif; color:#1a1a1a;
    height:100%; overflow:hidden;
  }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:clamp(24px,4vh,56px) clamp(24px,5vw,64px); text-align:center;
  }
  #logo { margin-bottom:clamp(8px,1.5vh,18px); }
  #logo img { height:clamp(48px,9vw,110px); width:auto; display:block; margin:0 auto; }
  h1 {
    font-size:clamp(1.6rem,4.2vw,3rem); color:#1a1a1a; margin-bottom:clamp(4px,.8vh,10px);
  }
  #sub {
    font-size:clamp(.85rem,1.7vw,1.3rem); color:#6b6b6b; margin-bottom:clamp(20px,3vh,40px); font-family:monospace;
  }
  #wait-count {
    font-size:clamp(.75rem,1.4vw,1.1rem); color:#1a1a1a; font-family:monospace; margin-bottom:clamp(18px,3vh,36px);
    border:1px solid #1a1a1a; border-radius:30px; padding:clamp(6px,1vh,12px) clamp(16px,2vw,28px);
  }
  .screen { display:none; width:100%; max-width:clamp(420px,70vw,760px); }
  .screen.show { display:flex; flex-direction:column; align-items:center; }

  label { display:block; font-size:clamp(.78rem,1.5vw,1.15rem); color:#6b6b6b; font-family:monospace;
    letter-spacing:.06em; margin:clamp(14px,2vh,26px) 0 clamp(8px,1.2vh,14px); align-self:flex-start; }
  #name-input {
    width:100%; font-size:clamp(1.1rem,2.6vw,1.8rem); padding:clamp(16px,2.6vh,28px); border-radius:14px;
    border:1.5px solid #1a1a1a; background:#ffffff; color:#1a1a1a;
    font-family:Arial,sans-serif; text-align:center;
  }
  #name-input:focus { outline:none; border-color:#d32323; }

  .party-row { display:flex; gap:clamp(8px,1.4vw,16px); flex-wrap:wrap; justify-content:center; width:100%; }
  .party-btn {
    width:clamp(52px,7.5vw,86px); height:clamp(50px,7vw,80px); border-radius:14px; border:1.5px solid #1a1a1a;
    background:#ffffff; color:#1a1a1a; font-size:clamp(1.05rem,2vw,1.6rem); font-weight:bold;
    font-family:monospace; cursor:pointer; touch-action:manipulation;
  }
  .party-btn.sel { background:#d32323; border-color:#d32323; color:#ffffff; }

  #phone-input {
    width:100%; font-size:clamp(1rem,2.2vw,1.5rem); padding:clamp(14px,2.2vh,24px); border-radius:14px;
    border:1.5px solid #1a1a1a; background:#ffffff; color:#1a1a1a;
    font-family:Arial,sans-serif; text-align:center;
  }
  #phone-input:focus { outline:none; border-color:#d32323; }
  #phone-hint { font-size:clamp(.62rem,1.2vw,.95rem); color:#6b6b6b; font-family:monospace; margin-top:clamp(6px,1vh,12px); }

  #submit-btn {
    width:100%; margin-top:clamp(28px,4vh,48px); padding:clamp(18px,2.8vh,30px); font-size:clamp(1.1rem,2.6vw,1.8rem); font-weight:bold;
    border-radius:16px; border:none; background:#d32323; color:#ffffff;
    border:1.5px solid #d32323; cursor:pointer; touch-action:manipulation;
    font-family:monospace; letter-spacing:.05em;
  }
  #submit-btn:disabled { opacity:.35; border-color:#6b6b6b; color:#6b6b6b; background:#ffffff; }

  #err { color:#d32323; font-size:clamp(.72rem,1.4vw,1.05rem); font-family:monospace; margin-top:clamp(10px,1.5vh,18px); min-height:14px; }

  /* Confirmation screen */
  #check { font-size:clamp(3.2rem,7vw,5.5rem); margin-bottom:clamp(10px,1.5vh,18px); }
  #confirm-name { font-size:clamp(1.4rem,3.4vw,2.4rem); color:#d32323; margin-bottom:clamp(6px,1vh,12px); font-weight:bold; }
  #confirm-msg { font-size:clamp(.85rem,1.8vw,1.3rem); color:#6b6b6b; margin-bottom:clamp(18px,3vh,32px); }
  #confirm-pos {
    font-size:clamp(.95rem,2vw,1.4rem); color:#1a1a1a; font-family:monospace;
    border:1.5px solid #1a1a1a; border-radius:16px; padding:clamp(14px,2.2vh,24px) clamp(22px,3.5vw,40px); margin-bottom:clamp(24px,3.5vh,40px);
  }
  #confirm-pos b { color:#d32323; font-size:clamp(1.3rem,2.8vw,1.9rem); }
  #new-signin {
    padding:clamp(14px,2.2vh,22px) clamp(28px,4vw,48px); border-radius:14px; border:1.5px solid #1a1a1a;
    background:none; color:#1a1a1a; font-family:monospace; font-size:clamp(.75rem,1.5vw,1.1rem);
    cursor:pointer; touch-action:manipulation;
  }
  #auto-note { font-size:clamp(.62rem,1.2vw,.9rem); color:#6b6b6b; font-family:monospace; margin-top:clamp(14px,2vh,24px); }
</style>
</head>

<h1>Welcome!</h1>
<div id="sub">Add your name to the waitlist below</div>
<div id="wait-count">— checking current wait —</div>

<!-- Sign-in form -->
<div class="screen show" id="screen-form">
  <label for="name-input">YOUR NAME</label>
  <input id="name-input" type="text" placeholder="e.g. Maria" maxlength="40" autocomplete="off">

  <label>PARTY SIZE</label>
  <div class="party-row" id="party-row">
    <button class="party-btn" data-n="1">1</button>
    <button class="party-btn" data-n="2">2</button>
    <button class="party-btn" data-n="3">3</button>
    <button class="party-btn" data-n="4">4</button>
    <button class="party-btn" data-n="5">5</button>
    <button class="party-btn" data-n="6">6</button>
    <button class="party-btn" data-n="7">7</button>
    <button class="party-btn" data-n="8">8</button>
    <button class="party-btn" data-n="9">9</button>
    <button class="party-btn" data-n="10">10</button>
    <button class="party-btn" data-n="11">11</button>
    <button class="party-btn" data-n="12">12</button>
    <button class="party-btn" data-n="13">13</button>
    <button class="party-btn" data-n="14">14</button>
  </div>

  <label for="phone-input">PHONE NUMBER (OPTIONAL)</label>
  <input id="phone-input" type="tel" placeholder="(555) 123-4567" maxlength="20" autocomplete="off">
  <div id="phone-hint">We'll only use this to text you when your table's ready</div>

  <button id="submit-btn" disabled>JOIN WAITLIST</button>
  <div id="err"></div>
</div>

<!-- Confirmation -->
<div class="screen" id="screen-confirm">
  <div id="check">✅</div>
  <div id="confirm-name"></div>
  <div id="confirm-msg">You're on the list — we'll come find you when your table's ready.</div>
  <div id="confirm-pos">Parties ahead of you: <b id="confirm-ahead">0</b></div>
  <button id="new-signin">SIGN IN ANOTHER GUEST</button>
  <div id="auto-note">This screen resets automatically in a few seconds…</div>
</div>

<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyBEKSzbyewhsoc2gprhxEqZojdPtv98Hbw",
    authDomain: "gohan-gilroy-ayce.firebaseapp.com",
    databaseURL: "https://gohan-gilroy-ayce-default-rtdb.firebaseio.com",
    projectId: "gohan-gilroy-ayce",
    storageBucket: "gohan-gilroy-ayce.firebasestorage.app",
    messagingSenderId: "256570680771",
    appId: "1:256570680771:web:64baa5d5c2fbb4dad0c976"
  };
  firebase.initializeApp(firebaseConfig);
  var wlRef = firebase.database().ref('waitlist');

  var nameInput   = document.getElementById('name-input');
  var phoneInput  = document.getElementById('phone-input');
  var partyRow    = document.getElementById('party-row');
  var submitBtn   = document.getElementById('submit-btn');
  var errEl       = document.getElementById('err');
  var waitCountEl = document.getElementById('wait-count');
  var screenForm    = document.getElementById('screen-form');
  var screenConfirm = document.getElementById('screen-confirm');
  var confirmName = document.getElementById('confirm-name');
  var confirmAhead = document.getElementById('confirm-ahead');
  var newSignin   = document.getElementById('new-signin');

  var selectedParty = null;
  var currentWaitingCount = 0;
  var resetTimer = null;

  // Live count of people currently waiting (for the on-screen reassurance message)
  wlRef.on('value', function(snap) {
    var data = snap.val() || {};
    var n = 0;
    Object.keys(data).forEach(function(id){ if (data[id].status==='waiting') n++; });
    currentWaitingCount = n;
    waitCountEl.textContent = n===0
      ? 'No current wait — come on in!'
      : n+' part'+(n===1?'y':'ies')+' currently waiting';
  });

  partyRow.querySelectorAll('.party-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      partyRow.querySelectorAll('.party-btn').forEach(function(b){ b.classList.remove('sel'); });
      btn.classList.add('sel');
      selectedParty = parseInt(btn.getAttribute('data-n'));
      validate();
    });
  });

  nameInput.addEventListener('input', validate);
  function validate() {
    var ok = nameInput.value.trim().length>0 && selectedParty!==null;
    submitBtn.disabled = !ok;
  }

  submitBtn.addEventListener('click', function(){
    var name = nameInput.value.trim();
    if (!name || !selectedParty) return;
    submitBtn.disabled = true;
    errEl.textContent = '';

    var ahead = currentWaitingCount;
    var entry = {
      name: name,
      party: selectedParty,
      phone: phoneInput.value.trim(),
      status: 'waiting',
      joinedAt: firebase.database.ServerValue.TIMESTAMP
    };

    wlRef.push(entry, function(error){
      if (error) {
        errEl.textContent = "Couldn't reach the waitlist — please tell a staff member.";
        submitBtn.disabled = false;
        return;
      }
      confirmName.textContent = name;
      confirmAhead.textContent = ahead;
      screenForm.classList.remove('show');
      screenConfirm.classList.add('show');

      clearTimeout(resetTimer);
      resetTimer = setTimeout(resetForm, 8000);
    });
  });

  function resetForm() {
    nameInput.value = '';
    phoneInput.value = '';
    selectedParty = null;
    partyRow.querySelectorAll('.party-btn').forEach(function(b){ b.classList.remove('sel'); });
    submitBtn.disabled = true;
    errEl.textContent = '';
    screenConfirm.classList.remove('show');
    screenForm.classList.add('show');
  }

  newSignin.addEventListener('click', function(){
    clearTimeout(resetTimer);
    resetForm();
  });
})();
</script>
</body>
</html>
